<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swift timetable</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2c2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timetable">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f7fa; --surface: #ffffff; --ink: #18202e; --muted: #5a6475;
    --line: #dce1e8; --mine: #2c2a5b; --now: #ebeaf5; --chg: #8a4600; --chg-bg: #fff0d9;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12161d; --surface: #1b212b; --ink: #e9edf3; --muted: #9aa4b4;
            --line: #2c3442; --mine: #b4b1ee; --now: #25243d; --chg: #ffcf8a; --chg-bg: #3a2b14; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.45 'Atkinson Hyperlegible', system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
  [hidden] { display: none !important; }
  .logo { display: block; margin: 4px 0 18px; }
  .logo img { display: block; height: 56px; width: auto; }

  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; }
  .views button { font: inherit; font-size: 15px; color: var(--muted); background: none; border: 0;
                  border-radius: 9px; padding: 10px 4px; min-height: 44px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--now); color: var(--ink); font-weight: 700; }

  header { display: grid; gap: 10px; margin-bottom: 8px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 15px; }
  select, .weeks button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%;
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .weeks button { cursor: pointer; text-align: left; }
  .weeks button small { display: block; color: var(--muted); font-size: 13px; }
  .weeks button[aria-pressed="true"] { border-color: var(--mine); box-shadow: inset 0 0 0 1px var(--mine); }
  :focus-visible { outline: 3px solid var(--mine); outline-offset: 2px; }

  .day { margin-top: 22px; }
  .day h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 700; }
  .day.is-today h2 { color: var(--ink); }
  .day.is-today h2::after { content: ' · today'; font-weight: 400; color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; padding: 4px 0; }

  .cls { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cls:first-of-type { border-top: 0; }
  .time { font-variant-numeric: tabular-nums; font-weight: 700; }
  .time span { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
  .body { border-left: 6px solid var(--c); padding-left: 12px; }
  .code { font-weight: 700; }
  .meta { color: var(--muted); font-size: 14px; }
  .cls.past .time, .cls.past .code { color: var(--muted); }
  .cls.past .body { border-left-color: var(--line); }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 6px;
         background: var(--now); color: var(--mine); margin-left: 8px; vertical-align: 1px; }

  .room { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .room:first-child { border-top: 0; }
  .room b { font-size: 18px; }
  .room span { color: var(--muted); font-size: 15px; text-align: right; }

  .tag.chg { background: var(--chg-bg); color: var(--chg); }
  .cls.removed .code { text-decoration: line-through; color: var(--muted); }
  .cls.removed .body { border-left-color: var(--line); }
  .notice { margin: 18px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--chg-bg); color: var(--chg); font-weight: 700; }

  .linkbtn { font: inherit; font-size: 15px; color: var(--mine); background: none; border: 0; padding: 6px 0;
             min-height: 44px; text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 15px; }
  .panel p { margin: 0 0 10px; }
  .panel ul { margin: 0; padding-left: 18px; color: var(--muted); }
  .panel li { margin-bottom: 6px; }
  .panel li b { color: var(--ink); }
  .copy { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 12px; }
  .copy input { font: inherit; font-size: 13px; min-width: 0; color: var(--ink); background: var(--paper);
                border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .btn { font: inherit; font-size: 15px; font-weight: 700; color: var(--surface); background: var(--mine);
         border: 0; border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
  .panel .btn { margin-top: 4px; }
  a { color: var(--mine); }

  .status { margin-top: 28px; color: var(--muted); }
  .status strong { color: var(--ink); display: block; }

  /* 2026 staff app refinement */
  .wrap { max-width: 650px; padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .logo { margin-bottom: 4px; }
  .logo img { height: 47px; max-width: 100%; }
  .brand-label { font-weight: 700; font-size: 11px; letter-spacing: .16em; color: var(--muted); margin: 0 0 20px; }
  .views { margin-bottom: 12px; }
  .views button { transition: background .15s ease; }
  .views button:hover:not([aria-pressed="true"]) { background: var(--paper); }
  .syncbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
             color: var(--muted); font-size: 12px; margin: 0 0 20px; padding: 0 2px; }
  .syncbar .sync-label { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .sync-dot { display: inline-block; flex: none; height: 7px; width: 7px; border-radius: 100%;
              background: #39826e; }
  .syncbar.warn .sync-dot { background: #c18429; }
  .syncbar button { border: 0; background: none; padding: 8px 3px; color: var(--mine);
                    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .syncbar button:disabled { opacity: .5; cursor: default; }
  header { gap: 12px; }
  h1 { font-size: clamp(23px, 5.5vw, 30px); }
  .sub { margin-top: -4px; }
  .two, .three { display: grid; gap: 8px; }
  .three { grid-template-columns: 1fr 1fr 1fr; }
  .three select { padding: 9px 6px; font-size: 14px; }
  .day { margin-top: 26px; }
  .day h2 { color: var(--ink); font-size: 17px; margin-bottom: 10px; }
  .cls { grid-template-columns: 60px 1fr; gap: 10px; margin-bottom: 9px; padding: 13px;
         border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .cls:first-of-type { border-top: 1px solid var(--line); }
  .cls.now { border-color: var(--mine); background: var(--now); }
  .cls.next { border-color: var(--mine); }
  .cls .time { font-size: 15px; }
  .cls .body { min-width: 0; border-left-width: 4px; }
  .cls .meta { margin-top: 4px; }
  .tag { margin-left: 6px; }
  .room { align-items: center; border: 1px solid var(--line); background: var(--surface);
          border-radius: 11px; padding: 14px; margin-bottom: 8px; }
  .room:first-child { border-top: 1px solid var(--line); }
  .room span { max-width: 65%; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
             padding: 18px; margin: 19px 0 16px; }
  .feature.current { background: var(--now); border-color: var(--mine); }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .10em; font-weight: 700; color: var(--muted); }
  .feature h2 { margin: 5px 0 7px; font-size: 22px; line-height: 1.2; }
  .feature .lead { font-weight: 700; color: var(--mine); }
  .feature p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
  .feature .detail { color: var(--ink); }
  .change-summary { margin: 17px 0 15px; padding: 16px; background: var(--chg-bg);
                    border: 1px solid var(--line); border-radius: 12px; }
  .change-summary h2 { margin: 0 0 6px; font-size: 16px; color: var(--chg); }
  .change-summary ul { list-style: none; padding: 0; margin: 10px 0 12px; }
  .change-summary li { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); }
  .change-summary li:first-child { border-top: 0; }
  .change-summary button { font: inherit; cursor: pointer; background: var(--surface);
                           border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
                           min-height: 39px; padding: 8px 12px; font-weight: 700; }
  .room-help { margin: 12px 0 4px; color: var(--muted); font-size: 14px; }
  @media (max-width: 380px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    .three { grid-template-columns: 1fr 1fr; }
    .three select:last-child { grid-column: 1 / -1; }
    .cls { padding: 11px; grid-template-columns: 55px 1fr; }
  }

  /* Week calendar: an optional, scrollable five-day visual timetable */
  .wrap.wide { max-width: 920px; }
  .week-display { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                  margin: 1px 0 2px; }
  .week-display > span { font-size: 14px; font-weight: 700; color: var(--muted); }
  .display-buttons { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line);
                     border-radius: 10px; background: var(--surface); }
  .display-buttons button { font: inherit; font-size: 14px; min-height: 38px; padding: 7px 13px;
                            border: 0; border-radius: 7px; background: transparent;
                            color: var(--muted); cursor: pointer; }
  .display-buttons button[aria-pressed="true"] { background: var(--now); color: var(--ink); font-weight: 700; }
  .calendar-intro { margin: 16px 0 10px; font-size: 14px; color: var(--muted); }
  .calendar-scroll { overflow-x: auto; overscroll-behavior-x: contain; border: 1px solid var(--line);
                     border-radius: 14px; background: var(--surface); scrollbar-width: thin; }
  .calendar-scroll:focus-visible { outline-offset: 3px; }
  .calendar-grid { display: grid; grid-template-columns: 54px repeat(5, minmax(132px, 1fr));
                   min-width: 740px; }
  .cal-corner, .cal-heading { position: relative; padding: 12px 7px; min-height: 56px;
                              border-bottom: 1px solid var(--line); background: var(--surface); }
  .cal-corner { position: sticky; left: 0; z-index: 3; border-right: 1px solid var(--line); }
  .cal-heading { text-align: center; border-left: 1px solid var(--line); }
  .cal-heading strong { display: block; color: var(--ink); font-size: 15px; }
  .cal-heading small { display: block; font-size: 12px; color: var(--muted); }
  .cal-heading.is-today { background: var(--now); }
  .cal-heading.is-today strong { color: var(--mine); }
  .cal-hours { position: sticky; left: 0; z-index: 2; border-right: 1px solid var(--line);
               background: var(--surface); }
  .cal-hour { position: absolute; right: 7px; transform: translateY(-.55em); font-size: 11px;
              font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .cal-hour:first-child { transform: translateY(1px); }
  .cal-lane { position: relative; border-left: 1px solid var(--line);
              background-image: repeating-linear-gradient(to bottom,
                var(--line) 0, var(--line) 1px, transparent 1px, transparent 63px); }
  .cal-lane.is-today { background-color: var(--now); }
  .cal-event { position: absolute; z-index: 1; overflow: hidden; padding: 6px 6px 5px;
               border: 1px solid var(--line); border-left: 4px solid var(--c);
               border-radius: 7px; background: var(--surface); box-shadow: 0 1px 3px #00000011;
               text-align: left; line-height: 1.22; }
  .cal-event { font: inherit; color: var(--ink); cursor: pointer; }
  .cal-event:hover, .cal-event:focus-visible { outline: 2px solid var(--mine); outline-offset: -2px; }
  .lesson-dialog { width: min(92vw, 440px); max-width: 440px; padding: 25px; color: var(--ink);
                   background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
                   box-shadow: 0 18px 55px #0003; }
  .lesson-dialog::backdrop { background: #11182799; }
  .lesson-dialog h2 { font-size: 23px; margin: 0 0 11px; }
  .lesson-dialog p { margin: 10px 0; }
  .lesson-dialog .dialog-close { float: right; border: 1px solid var(--line); border-radius: 8px;
                                 background: var(--paper); color: var(--ink); padding: 6px 12px;
                                 min-height: 36px; font: inherit; cursor: pointer; }
  .cal-event strong { display: block; font-size: 12px; line-height: 1.2;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-event .cal-when, .cal-event .cal-place { display: block; font-size: 11px; margin-top: 3px;
                                                color: var(--muted); white-space: nowrap;
                                                overflow: hidden; text-overflow: ellipsis; }
  .cal-event.past { opacity: .65; }
  .cal-event.changed { outline: 2px solid var(--chg); outline-offset: -2px; }
  .cal-empty { display: block; padding: 13px 6px; font-size: 12px; text-align: center;
               color: var(--muted); }
  .cal-hint { display: none; margin: 8px 2px 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 780px) { .cal-hint { display: block; } }
  @media (prefers-reduced-motion: reduce) {
    .views button { transition: none; }
  }
</style>
</head>

  <p class="brand-label">STAFF TIMETABLE</p>
  <div class="views" role="group" aria-label="View">
    <button data-view="week" aria-pressed="true">My week</button>
    <button data-view="today" aria-pressed="false">Today</button>
    <button data-view="rooms" aria-pressed="false">Free rooms</button>
  </div>
  <div class="syncbar warn" id="syncBar" role="status" aria-live="polite">
    <span class="sync-label"><span class="sync-dot" aria-hidden="true"></span><span id="syncStatus">Checking timetable…</span></span>
    <button type="button" id="refreshBtn" aria-label="Refresh the timetable">↻ Refresh</button>
  </div>

  <header>
    <h1 id="title">Your timetable</h1>
    <div class="sub" id="sub"></div>
    <select id="teacher" aria-label="Your name"><option value="">Choose your name</option></select>
    <button type="button" class="linkbtn" id="calBtn" hidden>Add my classes to my calendar</button>
    <div class="panel" id="calPanel" hidden></div>
    <div class="panel" id="tip" hidden>
      <p><b>Tip:</b> put this page on your home screen so it opens like an app.</p>
      <ul>
        <li><b>iPhone (Safari):</b> tap Share, then Add to Home Screen.</li>
        <li><b>Android (Chrome):</b> tap the ⋮ menu, then Add to Home screen.</li>
      </ul>
      <button type="button" class="btn" id="tipOk">Got it</button>
    </div>
    <div class="weeks two" id="weeks" role="group" aria-label="Week">
      <button data-week="0" aria-pressed="true">This week<small>&nbsp;</small></button>
      <button data-week="1" aria-pressed="false">Next week<small>&nbsp;</small></button>
    </div>
<div class="week-display" id="weekDisplay" role="group" aria-label="Weekly timetable layout">
      <span>Weekly view</span>
      <div class="display-buttons">
        <button type="button" data-week-mode="list" aria-pressed="true">List</button>
        <button type="button" data-week-mode="calendar" aria-pressed="false">Calendar</button>
      </div>
    </div>
    <div class="three" id="roomPick" hidden>
      <select id="rDay" aria-label="Day"></select>
      <select id="rTime" aria-label="Start time"></select>
      <select id="rDuration" aria-label="Required free duration">
        <option value="30">30 min free</option>
        <option value="60">60 min free</option>
        <option value="90">90 min free</option>
      </select>
    </div>
  </header>
  <main id="out"><p class="status">Loading the timetable…</p></main>
  <dialog id="lessonDialog" class="lesson-dialog" aria-labelledby="lessonTitle">
    <form method="dialog"><button type="submit" class="dialog-close">Close</button></form>
    <p class="eyebrow">Lesson details</p>
    <h2 id="lessonTitle"></h2>
    <p id="lessonWhen"></p>
    <p id="lessonPlace"></p>
    <p id="lessonNotes"></p>
  </dialog>
</div>

<script>
  // The Apps Script web app link (Deploy > Manage deployments > Web app URL).
  // If you ever make a NEW deployment, paste its /exec link here.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwHgOQG7-j9Zo8Lv9gA_aNYgS6Y41_fpt0sXmHjmKVXsERJFueZ_Y6t17sM6mfeXeng/exec';
  const BOOT = null, APP_URL = SCRIPT_URL;
</script>
<script>
  const DAYS = [['MON','Monday'],['TUE','Tuesday'],['WED','Wednesday'],['THU','Thursday'],['FRI','Friday']];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);
  const sel = $('teacher'), out = $('out');
  let view = 'week', offset = 0, data = {}, pending = {};
  let weekMode = store.get('weekMode') === 'calendar' ? 'calendar' : 'list';

  // ---------- controls ----------
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    view = b.dataset.view;
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (view === 'today') offset = 0;
    syncWeekButtons();
    if (view === 'rooms') resetRoomPickers();
    load();
  });
  document.querySelectorAll('[data-week]').forEach(b => b.onclick = () => {
    offset = Number(b.dataset.week); syncWeekButtons();
    if (view === 'rooms') resetRoomPickers();
    load();
  });
  sel.onchange = () => { store.set('teacher', sel.value); $('calPanel').hidden = true; render(); };
  $('rDay').onchange = render;
  $('rTime').onchange = render;
  $('rDuration').onchange = render;
  document.querySelectorAll('[data-week-mode]').forEach(b => {
    b.onclick = () => {
      weekMode = b.dataset.weekMode;
      store.set('weekMode', weekMode);
      render();
    };
  });
  function syncWeekMode() {
    document.querySelectorAll('[data-week-mode]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.weekMode === weekMode)));
  }

  function syncWeekButtons() {
    document.querySelectorAll('[data-week]').forEach(x => x.setAttribute('aria-pressed', Number(x.dataset.week) === offset));
  }

  // ---------- data ----------
  // Data comes from the Apps Script link as JSON. The last copy is kept on the phone
  // so the page shows straight away, then updates when fresh data arrives.
  let loading = null, isFresh = false, requestError = false;
  let lastCheckedAt = Number(store.get('lastCheckedAt') || 0);
  function checkedLabel() {
    if (!lastCheckedAt) return 'No saved update time';
    const d = new Date(lastCheckedAt);
    const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return 'Last checked ' + (d.toDateString() === new Date().toDateString() ? 'today' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })) + ' at ' + time;
  }
  function updateSyncStatus() {
    const offline = !navigator.onLine;
    const label = offline ? (data[0] ? 'Offline · saved timetable' : 'Offline')
      : loading ? 'Checking for timetable updates…'
      : requestError ? (data[0] ? 'Unable to update · saved timetable' : 'Unable to connect')
      : isFresh ? checkedLabel() : (data[0] ? 'Saved copy · ' + checkedLabel() : 'Waiting for timetable…');
    $('syncStatus').textContent = label;
    $('syncBar').classList.toggle('warn', offline || requestError || !isFresh);
    $('refreshBtn').disabled = !!loading || offline;
  }
  function load() {
    if (data[offset]) return render();
    out.innerHTML = '<p class="status">Loading the timetable…</p>';
    fetchAll();
  }

  function fetchAll() {
    if (loading) return loading;
    requestError = false;
    loading = fetch(SCRIPT_URL + '?api=weeks&v=' + Date.now(), { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Timetable service answered ' + r.status + '.'); return r.json(); })
      .then(res => {
        if (res.error) throw new Error(res.error);
        if (!res.weeks || res.weeks.length < 2) throw new Error('Incomplete timetable response.');
        isFresh = true;
        lastCheckedAt = Date.now();
        store.set('lastCheckedAt', String(lastCheckedAt));
        accept(0, res.weeks[0]); accept(1, res.weeks[1]);
        store.set('lastData', JSON.stringify(res.weeks));
        render();
      })
      .catch(err => {
        requestError = true;
        if (!data[offset]) out.innerHTML = '<p class="status"><strong>The timetable could not be loaded.</strong>' +
          esc(err.message) + ' Check your connection and try Refresh.</p>';
      })
      .finally(() => { loading = null; updateSyncStatus(); });
    updateSyncStatus();
    return loading;
  }

  $('refreshBtn').onclick = fetchAll;
  window.addEventListener('online', () => { updateSyncStatus(); fetchAll(); });
  window.addEventListener('offline', updateSyncStatus);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine && Date.now() - lastCheckedAt > 120000) fetchAll();
  });
  setInterval(() => {
    if (!document.hidden && navigator.onLine && Date.now() - lastCheckedAt >= 5 * 60000) fetchAll();
  }, 60000);

  function cachedWeeks() {
    try {
      const weeks = JSON.parse(store.get('lastData') || 'null');
      if (!weeks) return null;
      const now = new Date(), d = new Date(now.getFullYear(), now.getMonth(), now.getDate()), dow = d.getDay();
      d.setDate(d.getDate() + (dow === 6 ? 2 : dow === 0 ? 1 : 1 - dow));
      return new Date(weeks[0].mondayIso).toDateString() === d.toDateString() ? weeks : null;
    } catch (e) { return null; }
  }

  function accept(o, res) {
    data[o] = res; fillTeachers(res.teachers);
    document.querySelector('[data-week="' + o + '"] small').textContent = 'from ' + res.mondayLabel;
    if (view === 'rooms' && o === offset) resetRoomPickers(true);
  }

  function fillTeachers(list) {
    const have = [...sel.options].slice(1).map(o => o.value).join('|');
    if (have === list.join('|')) return;
    const keep = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    list.forEach(n => sel.add(new Option(n, n)));
    if (keep && list.includes(keep)) { sel.value = keep; return; }
    const saved = store.get('teacher');
    if (saved && list.includes(saved)) sel.value = saved;
  }

  // ---------- changes since last visit ----------
  // Each teacher's classes for each week are remembered on this device. Next time,
  // anything new, moved or removed is marked. Marks stay for the whole visit.
  const sig = c => [c.day, c.start, c.end, c.room, c.online ? 'OL' : '', c.code, c.notes || ''].join('|');
  const storedClass = c => ({
    day: c.day, start: c.start, end: c.end, room: c.room,
    online: !!c.online, code: c.code, notes: c.notes || ''
  });
  function seenKey(res, me) { return 'seen:' + me + ':' + res.mondayIso; }
  function changesFor(res, me, mine) {
    const d = { marks: new Map(), removed: [], count: 0 };
    if (!isFresh) return d; // A cached schedule may be out of date.
    const k = seenKey(res, me);
    let prev = null;
    try { prev = JSON.parse(store.get(k) || 'null'); } catch (e) {}
    if (!Array.isArray(prev)) {
      // On a teacher's first visit there is no previous timetable to compare.
      store.set(k, JSON.stringify(mine.map(storedClass)));
      return d;
    }
    const left = prev.slice(), unmatched = [];
    mine.forEach(c => {
      const i = left.findIndex(p => sig(p) === sig(c));
      i > -1 ? left.splice(i, 1) : unmatched.push(c);
    });
    unmatched.forEach(c => {
      let i = left.findIndex(p => p.day === c.day && p.code === c.code);
      if (i < 0) i = left.findIndex(p => p.code === c.code);
      if (i < 0) { d.marks.set(c, { kind: 'New' }); return; }
      const p = left.splice(i, 1)[0], was = [];
      if (p.day !== c.day) was.push(p.day);
      if (p.start !== c.start || p.end !== c.end) was.push(p.start + '–' + p.end);
      if (p.room !== c.room || !!p.online !== !!c.online) was.push(p.online ? 'online' : 'Room ' + p.room);
      if ((p.notes || '') !== (c.notes || '')) was.push('notes updated');
      d.marks.set(c, { kind: 'Changed', was: was.join(' · ') });
    });
    d.removed = left;
    d.count = d.marks.size + left.length;
    return d;
  }
  function changeSummary(ch) {
    if (!ch.count) return '';
    const lines = [];
    ch.marks.forEach((m, c) => {
      const target = c.online ? 'online' : 'Room ' + c.room;
      lines.push('<li><b>' + esc(c.code) + '</b> · ' + esc(c.day) + ' ' + esc(c.start) + ' · ' +
        esc(target) + (m.kind === 'New' ? ' <b>New</b>' : ' <b>Changed</b>' +
          (m.was ? '<div>Previously: ' + esc(m.was) + '</div>' : '')) + '</li>');
    });
    ch.removed.forEach(c => lines.push('<li><b>' + esc(c.code) + '</b> · ' + esc(c.day) + ' ' +
      esc(c.start) + ' · <b>Removed</b></li>'));
    return '<section class="change-summary" aria-label="Timetable changes">' +
      '<h2>' + ch.count + (ch.count === 1 ? ' timetable change' : ' timetable changes') + '</h2>' +
      '<p>These changes are compared with the timetable you last acknowledged.</p>' +
      '<ul>' + lines.join('') + '</ul><button type="button" data-action="ack">Mark changes as seen</button></section>';
  }
  out.addEventListener('click', e => {
    const lesson = e.target.closest('.cal-event');
    if (lesson) {
      $('lessonTitle').textContent = lesson.dataset.code || 'Lesson';
      $('lessonWhen').textContent = lesson.dataset.when || '';
      $('lessonPlace').textContent = lesson.dataset.place || '';
      $('lessonNotes').textContent = lesson.dataset.notes || '';
      $('lessonNotes').hidden = !lesson.dataset.notes;
      $('lessonDialog').showModal();
      return;
    }
    const target = e.target.closest('[data-action="ack"]');
    if (!target) return;
    const res = data[offset], me = sel.value;
    if (!res || !me || !isFresh) return;
    store.set(seenKey(res, me), JSON.stringify(res.classes.filter(c => c.teacher === me).map(storedClass)));
    render();
  });

  // ---------- calendar ----------
  $('calBtn').onclick = () => {
    const panel = $('calPanel');
    panel.hidden = !panel.hidden;
    if (panel.hidden) return;
    const feed = APP_URL + '?ics=' + encodeURIComponent(sel.value);
    panel.innerHTML =
      '<p>Your classes appear in your own calendar and update by themselves.</p>' +
      '<div class="copy"><input id="feed" readonly aria-label="Calendar link" value="' + esc(feed) + '">' +
      '<button type="button" class="btn" id="copyFeed">Copy</button></div>' +
      '<ul>' +
      '<li><b>iPhone:</b> <a href="' + esc(feed.replace(/^https:/, 'webcal:')) + '">tap here</a>, then Subscribe.</li>' +
      '<li><b>Google Calendar (Android):</b> on a computer, open calendar.google.com, click + next to Other calendars, choose From URL and paste the link. It then shows on your phone too.</li>' +
      '<li><b>Outlook:</b> Add calendar, then Subscribe from web, and paste the link.</li>' +
      '</ul>' +
      '<p class="meta" style="margin:10px 0 0">Google Calendar only checks for changes every few hours, so look here for last-minute changes.</p>';
    $('copyFeed').onclick = () => {
      const input = $('feed'); input.select();
      const done = () => { $('copyFeed').textContent = 'Copied'; };
      (navigator.clipboard ? navigator.clipboard.writeText(input.value) : Promise.reject())
        .then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
    };
  };

  // ---------- home-screen tip (shown until dismissed) ----------
  if (store.get('tipHome') !== 'done') $('tip').hidden = false;
  $('tipOk').onclick = () => { store.set('tipHome', 'done'); $('tip').hidden = true; };

  // ---------- render ----------
  function render() {
    const res = data[offset];
    if (!res) return;
    $('weeks').hidden = view === 'today';
    sel.hidden = view === 'rooms';
    $('roomPick').hidden = view !== 'rooms';
    $('weekDisplay').hidden = view !== 'week';
    document.querySelector('.wrap').classList.toggle('wide', view === 'week' && weekMode === 'calendar');
    syncWeekMode();
    if (view === 'rooms') { $('calBtn').hidden = true; $('calPanel').hidden = true; return renderRooms(res); }

    const me = sel.value;
    $('title').textContent = me || 'Your timetable';
    $('calBtn').hidden = !me || !APP_URL;
    if (!me) $('calPanel').hidden = true;
    if (!me) { $('sub').textContent = ''; out.innerHTML = '<p class="status">Choose your name to see your classes.</p>'; return; }
    if (!res.found) return noTimetable(res);
    const mine = res.classes.filter(c => c.teacher === me);
    view === 'today' ? renderToday(res, mine) : renderWeek(res, mine);
  }

  function noTimetable(res) {
    $('sub').textContent = '';
    out.innerHTML = '<p class="status"><strong>No timetable yet for the week of ' + esc(res.mondayLabel) +
      '.</strong>It appears here once the head of studies shares it.</p>';
  }

  function renderWeek(res, mine) {
    const mins = mine.reduce((s, c) => s + toMins(c.end) - toMins(c.start), 0);
    $('sub').textContent = mine.length ? mine.length + ' lessons · ' + fmtHours(mins) + ' this week' : 'No scheduled lessons this week';
    const today = new Date().toDateString();
    const ch = changesFor(res, sel.value, mine);
    if (weekMode === 'calendar') {
      out.innerHTML = changeSummary(ch) + renderWeekCalendar(res, mine, ch);
      return;
    }
    out.innerHTML = changeSummary(ch) +
      DAYS.map(([key, name], i) => {
        const d = dayDate(res, i);
        const list = byStart(mine.filter(c => c.day === key).concat(ch.removed.filter(p => p.day === key)
          .map(p => Object.assign({ removed: true }, p))));
        return '<section class="day' + (d.toDateString() === today ? ' is-today' : '') + '">' +
          '<h2>' + name + ' ' + d.getDate() + '</h2>' +
          (list.length ? list.map(c => row(c, '', ch.marks.get(c))).join('') : '<p class="empty">No classes</p>') + '</section>';
      }).join('');
  }


  // A five-column, vertically timed week. Lesson positions are calculated from
  // the actual class times, not pre-set timetable periods.
  function renderWeekCalendar(res, mine, changes) {
    if (!mine.length) return '<p class="status">No lessons scheduled this week.</p>';
    const first = Math.max(0, Math.floor(Math.min(8 * 60, ...mine.map(c => toMins(c.start))) / 30) * 30);
    const last = Math.min(24 * 60, Math.ceil(Math.max(18 * 60, ...mine.map(c => toMins(c.end))) / 30) * 30);
    const pxPerMin = 1.05, totalHeight = (last - first) * pxPerMin;
    const today = new Date().toDateString();
    const headings = DAYS.map(([key, name], i) => {
      const date = dayDate(res, i);
      return '<div class="cal-heading' + (date.toDateString() === today ? ' is-today' : '') +
        '"><strong>' + name.slice(0, 3) + ' ' + date.getDate() + '</strong>' +
        '<small>' + (date.toDateString() === today ? 'Today' : name) + '</small></div>';
    }).join('');
    const ticks = [];
    for (let mins = first; mins <= last; mins += 60) {
      ticks.push('<span class="cal-hour" style="top:' + Math.round((mins - first) * pxPerMin) + 'px">' +
        esc(fmtTime(mins)) + '</span>');
    }
    const columns = DAYS.map(([key], i) => {
      const lessons = byStart(mine.filter(c => c.day === key));
      const groups = [];
      let group = [], groupEnd = -1;
      const finishGroup = () => {
        if (!group.length) return;
        const ends = [], arranged = [];
        group.forEach(c => {
          const begin = toMins(c.start);
          let lane = ends.findIndex(end => end <= begin);
          if (lane < 0) lane = ends.length;
          ends[lane] = toMins(c.end);
          arranged.push({ c, lane });
        });
        arranged.forEach(item => { item.count = ends.length; });
        groups.push(...arranged);
        group = [];
        groupEnd = -1;
      };
      lessons.forEach(c => {
        if (group.length && toMins(c.start) >= groupEnd) finishGroup();
        group.push(c);
        groupEnd = Math.max(groupEnd, toMins(c.end));
      });
      finishGroup();
      const events = groups.map(({ c, lane, count }) => {
        const start = toMins(c.start), end = toMins(c.end);
        const top = Math.round((start - first) * pxPerMin) + 2;
        const height = Math.max(19, Math.round((end - start) * pxPerMin) - 4);
        const left = (lane / count) * 100, width = 100 / count;
        const place = c.online ? 'Online' : (c.room ? 'Room ' + c.room : '');
        const mark = changes.marks.get(c);
        const altered = mark ? ' changed' : '';
        const past = dayDate(res, i).getTime() < new Date().setHours(0, 0, 0, 0) ||
          (dayDate(res, i).toDateString() === today &&
            end <= new Date().getHours() * 60 + new Date().getMinutes());
        const detail = [c.code, c.start + '–' + c.end, place, c.notes, mark?.kind].filter(Boolean).join(' · ');
        return '<button type="button" class="cal-event' + (past ? ' past' : '') + altered +
          '" aria-label="' + esc(detail) + '" title="' + esc(detail) +
          '" data-code="' + esc(c.code) + '" data-when="' +
          esc(DAYS[i][1] + ' ' + dayDate(res, i).getDate() + ' · ' + c.start + '–' + c.end) +
          '" data-place="' + esc(place) + '" data-notes="' + esc(c.notes || '') +
          '" style="--c:' + (c.colour || 'var(--mine)') + ';top:' + top + 'px;height:' + height +
          'px;left:calc(' + left + '% + 4px);width:calc(' + width + '% - 8px)">' +
          '<strong>' + esc(c.code) + '</strong><span class="cal-when">' +
          esc(c.start) + '–' + esc(c.end) + '</span>' +
          '<span class="cal-place">' + esc(place) + (mark ? ' · ' + esc(mark.kind) : '') +
          '</span></button>';
      }).join('');
      return '<div class="cal-lane' + (dayDate(res, i).toDateString() === today ? ' is-today' : '') +
        '" style="height:' + totalHeight + 'px">' +
        (events || '<span class="cal-empty">No lessons</span>') + '</div>';
    }).join('');
    return '<div class="calendar-intro">Lessons are positioned by time; blank spaces are free periods.</div>' +
      '<div class="calendar-scroll" tabindex="0" role="region" aria-label="Five-day timetable, horizontally scrollable">' +
      '<div class="calendar-grid"><div class="cal-corner" aria-hidden="true"></div>' +
      headings + '<div class="cal-hours" style="height:' + totalHeight + 'px">' + ticks.join('') +
      '</div>' + columns + '</div></div>' +
      '<p class="cal-hint">Swipe sideways to see all five days. Tap a class for its full details.</p>';
  }

  function durationText(minutes) {
    if (minutes <= 0) return 'now';
    const hours = Math.floor(minutes / 60), mins = minutes % 60;
    return (hours ? hours + 'h' : '') + (mins ? (hours ? ' ' : '') + mins + 'm' : '');
  }
  function renderToday(res, mine) {
    const now = new Date(), idx = now.getDay() - 1;
    if (idx < 0 || idx > 4) {
      $('sub').textContent = '';
      out.innerHTML = '<section class="feature"><span class="eyebrow">Enjoy your weekend</span>' +
        '<h2>No classes today</h2><p>Open My week to see the timetable for the coming week.</p></section>';
      return;
    }
    const [key, name] = DAYS[idx];
    const ch = changesFor(res, sel.value, mine);
    const list = byStart(mine.filter(c => c.day === key));
    const nowM = now.getHours() * 60 + now.getMinutes();
    const current = list.find(c => toMins(c.start) <= nowM && toMins(c.end) > nowM);
    const next = list.find(c => toMins(c.start) > nowM);
    const remaining = list.filter(c => toMins(c.end) > nowM).length;
    $('sub').textContent = name + ' ' + now.getDate() +
      (list.length ? ' · ' + remaining + ' of ' + list.length + ' lessons remaining' : '');
    let hero = '';
    if (current || next) {
      const c = current || next;
      hero = '<section class="feature' + (current ? ' current' : '') + '">' +
        '<span class="eyebrow">' + (current ? 'Teaching now' : 'Up next') + '</span>' +
        '<h2>' + esc(c.code) + '</h2><div class="lead">' +
        (current ? 'Ends in ' + durationText(toMins(c.end) - nowM) :
          'Starts in ' + durationText(toMins(c.start) - nowM)) + '</div>' +
        '<p class="detail">' + esc(c.start) + '–' + esc(c.end) + ' · ' +
        (c.online ? 'Online' : 'Room ' + esc(c.room)) + '</p>' +
        (c.notes ? '<p>' + esc(c.notes) + '</p>' : '') + '</section>';
    } else {
      hero = '<section class="feature"><span class="eyebrow">' + (list.length ? 'All done' : 'Your day') +
        '</span><h2>' + (list.length ? 'Lessons finished for today' : 'No classes today') +
        '</h2><p>' + (list.length ? 'Your teaching day is complete.' : 'You have no scheduled lessons today.') +
        '</p></section>';
    }
    out.innerHTML = changeSummary(ch) + hero +
      (list.length ? '<section class="day"><h2>Today’s lessons</h2>' +
        list.map((c) => {
          const s = toMins(c.start), e = toMins(c.end);
          const state = e <= nowM ? 'past' : s <= nowM ? 'now' : c === next ? 'next' : '';
          return row(c, state, ch.marks.get(c));
        }).join('') + '</section>' : '');
  }

  function resetRoomPickers(preserve) {
    const res = data[offset];
    if (!res || !res.found) return;
    const priorDay = preserve ? $('rDay').value : null;
    const priorTime = preserve ? $('rTime').value : null;
    const now = new Date(), idx = now.getDay() - 1;
    const isToday = offset === 0 && idx >= 0 && idx <= 4;
    const dayDefault = isToday ? DAYS[idx][0] : 'MON';
    const dayChoice = priorDay && DAYS.some(([k]) => k === priorDay) ? priorDay : dayDefault;
    $('rDay').innerHTML = DAYS.map(([k, n], i) =>
      '<option value="' + k + '"' + (k === dayChoice ? ' selected' : '') + '>' +
      n + ' ' + dayDate(res, i).getDate() + '</option>').join('');
    const nowM = now.getHours() * 60 + now.getMinutes();
    const slot = priorTime && res.slots.includes(priorTime) ? priorTime :
      ((isToday && res.slots.filter(t => toMins(t) <= nowM).pop()) || res.slots[0]);
    $('rTime').innerHTML = res.slots.map(t =>
      '<option' + (t === slot ? ' selected' : '') + '>' + t + '</option>').join('');
  }

  function renderRooms(res) {
    $('title').textContent = 'Free rooms';
    if (!res.found) return noTimetable(res);
    if (!$('rDay').options.length) resetRoomPickers(false);
    if (!res.slots || !res.slots.length) {
      out.innerHTML = '<p class="status">No time slots available for this week.</p>'; return;
    }
    const day = $('rDay').value, t = toMins($('rTime').value);
    const duration = Number($('rDuration').value) || 30;
    const end = t + duration;
    const close = toMins(res.slots[res.slots.length - 1]) + 30;
    const rooms = [...new Set(res.rooms[day] || [])];
    const used = res.classes.filter(c => c.day === day);
    const free = rooms.map(r => {
      const inRoom = used.filter(c => c.room === r);
      // A room is usable only when every minute of the chosen interval is free.
      if (end > close || inRoom.some(c => toMins(c.start) < end && toMins(c.end) > t)) return null;
      const next = inRoom.map(c => toMins(c.start)).filter(s => s >= end).sort((a, b) => a - b)[0];
      return { room: r, until: next === undefined ? close : next, allDay: next === undefined };
    }).filter(Boolean).sort((a, b) => b.until - a.until ||
      String(a.room).localeCompare(String(b.room), undefined, { numeric: true }));
    $('sub').textContent = free.length + ' of ' + rooms.length + ' rooms free for ' + duration + ' minutes';
    const intro = '<p class="room-help">Available from ' + esc($('rTime').value) + ' to ' +
      esc(fmtTime(end)) + ' · ' + esc($('rDay').selectedOptions[0]?.textContent || day) + '</p>';
    out.innerHTML = intro + (free.length
      ? '<section class="day">' + free.map(f =>
          '<div class="room"><b>Room ' + esc(f.room) + '</b><span>' +
          (f.allDay ? 'Free until closing' : 'Free until ' + fmtTime(f.until)) +
          ' · ' + fmtHours(f.until - t) + '</span></div>').join('') + '</section>'
      : '<p class="status">No rooms are available for the full ' + duration +
        ' minutes. Try another start time or a shorter duration.</p>');
  }

  function row(c, state, mark) {
    let tag = state === 'now' ? '<span class="tag">Now</span>' : state === 'next' ? '<span class="tag">Next</span>' : '';
    if (c.removed) tag = '<span class="tag chg">Removed</span>';
    else if (mark) tag += '<span class="tag chg">' + mark.kind + '</span>';
    const place = c.online ? 'Online' : c.room ? 'Room ' + esc(c.room) : '';
    const meta = [place, mark && mark.was ? esc(mark.was) : '', c.removed ? '' : esc(c.notes || '')].filter(Boolean).join(' · ');
    const cls = 'cls' + (state === 'past' ? ' past' : state === 'now' ? ' now' : state === 'next' ? ' next' : '') + (c.removed ? ' removed' : '');
    return '<div class="' + cls + '"><div class="time">' + c.start + '<span>' + c.end + '</span></div>' +
      '<div class="body" style="--c:' + (c.colour || 'var(--line)') + '"><div class="code">' + esc(c.code) + tag + '</div>' +
      '<div class="meta">' + meta + '</div></div></div>';
  }

  // ---------- helpers ----------
  function dayDate(res, i) { const d = new Date(res.mondayIso); d.setDate(d.getDate() + i); return d; }
  function byStart(list) { return list.slice().sort((a, b) => toMins(a.start) - toMins(b.start)); }
  function toMins(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
  function fmtTime(m) { return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }
  function fmtHours(m) { const h = m / 60; return (Number.isInteger(h) ? h : h.toFixed(1).replace('.', ',')) + ' h'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

  setInterval(() => { if (view === 'today') render(); updateSyncStatus(); }, 60000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  // The server usually sends both weeks with the page itself, so nothing waits on a second request.
  const cached = cachedWeeks();
  if (cached) { accept(0, cached[0]); accept(1, cached[1]); render(); }
  fetchAll();
  if (!cached) load();
  updateSyncStatus();
</script>
</body>
</html>
