name: Timetable regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  timetable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate parser, lesson data and frontend scripts
        run: |
          node tests/timetable.test.cjs
          node tests/change-alerts.test.cjs
          node tests/active-colours.test.cjs
          node tests/checks.test.cjs
          node tests/week-discovery.test.cjs
          node tests/shared-history.test.cjs
